<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --cream: #f5eedf; --cream-hi: #fcf8ef; --cream-lo: #eadfca;
      --sage: #8c9b8d; --sage-dk: #55655a; --sage-lt: #dfe5dc;
      --burg: #6d1f2f; --burg-dk: #4e1522;
      --ink: #2d1c1f; --muted: #627064;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      position: relative; min-height: 100vh; overflow-x: hidden; color: var(--ink);
      background: var(--cream);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; padding: 28px 20px 60px; text-align: center;
    }

    /* ---------- background: sage and burgundy washes + fading dot grid ---------- */
    body::before {
      content: ""; position: fixed; inset: -20%; z-index: -2; pointer-events: none;
      background:
        radial-gradient(42% 38% at 18% 22%, rgba(140, 155, 141, .55), transparent 70%),
        radial-gradient(38% 34% at 86% 30%, rgba(109, 31, 47, .13), transparent 70%),
        radial-gradient(46% 40% at 55% 92%, rgba(140, 155, 141, .35), transparent 70%);
      animation: drift 24s ease-in-out infinite alternate;
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image: radial-gradient(rgba(85, 101, 90, .28) 1px, transparent 1.3px);
      background-size: 30px 30px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 10%, transparent 68%);
              mask-image: radial-gradient(ellipse at 50% 50%, #000 10%, transparent 68%);
    }
    @keyframes drift { to { transform: translate(3%, -2%) rotate(4deg) scale(1.06); } }

    /* ---------- heading ---------- */
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--sage-dk); margin-bottom: 10px; }
    .eyebrow::before, .eyebrow::after { content: ""; display: inline-block; width: 28px; height: 1px; background: var(--sage); vertical-align: middle; margin: 0 12px; }
    .title {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin: 0; font-family: var(--serif); font-weight: 700; font-size: clamp(34px, 6.4vw, 60px);
      letter-spacing: .01em; line-height: 1.08; color: var(--burg);
    }
    .emoji {
      width: 1.3em; height: 1.3em; display: grid; place-items: center; font-size: .72em; letter-spacing: 0;
      border-radius: 50%; background: var(--cream-hi); border: 1px solid var(--sage);
      box-shadow: 0 6px 18px rgba(78, 21, 34, .14); animation: bob 3.4s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform: translateY(-5px) rotate(-6deg); } }
    .sub { margin: 12px auto 0; max-width: 44ch; color: var(--muted); font-size: 16px; }

    /* ---------- stage: orb + orbits + ripples ---------- */
    .stage {
      --size: clamp(150px, 26vmin, 230px);
      position: relative; width: calc(var(--size) * 1.95); height: calc(var(--size) * 1.95);
      display: grid; place-items: center; flex: none;
    }
    .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(85, 101, 90, .35); animation: spin 26s linear infinite; }
    .ring::after {
      content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%;
      background: var(--burg); box-shadow: 0 0 0 3px rgba(109, 31, 47, .18);
    }
    .r1 { width: 68%; height: 68%; animation-duration: 18s; }
    .r2 { width: 84%; height: 84%; border-style: dashed; border-color: rgba(109, 31, 47, .3); animation-duration: 32s; animation-direction: reverse; }
    .r2::after { background: var(--sage-dk); box-shadow: 0 0 0 3px rgba(85, 101, 90, .2); top: auto; bottom: -4px; }
    .r3 { width: 100%; height: 100%; border-color: rgba(85, 101, 90, .22); animation-duration: 46s; }
    .r3::after { background: var(--sage); box-shadow: 0 0 0 3px rgba(140, 155, 141, .3); width: 6px; height: 6px; margin-left: -3px; top: -3px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ripple {
      position: absolute; width: var(--size); height: var(--size); border-radius: 50%;
      border: 1.5px solid rgba(109, 31, 47, .4); opacity: 0; animation: ripple 5s ease-out infinite;
    }
    .ripple:nth-of-type(2) { animation-delay: 1.7s; }
    .ripple:nth-of-type(3) { animation-delay: 3.4s; }
    @keyframes ripple { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.85); opacity: 0; } }

    /* ---------- the orb ---------- */
    .orb {
      position: relative; width: var(--size); height: var(--size);
      border: 0; padding: 0; border-radius: 50%; cursor: pointer; background: radial-gradient(circle at 50% 40%, #5a1627 0%, #3a0c17 70%);
      overflow: hidden; isolation: isolate; z-index: 2;
      box-shadow: 0 0 0 6px rgba(252, 248, 239, .75), 0 0 0 7px rgba(140, 155, 141, .55),
                  0 22px 50px -8px rgba(78, 21, 34, .55), 0 0 90px 10px rgba(109, 31, 47, .18);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s;
      animation: breathe 5s ease-in-out infinite;
    }
    .orb:hover { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(252,248,239,.9), 0 0 0 7px var(--sage), 0 26px 60px -8px rgba(78,21,34,.65), 0 0 110px 16px rgba(109,31,47,.26); }
    .orb:active { transform: scale(.97); }
    .orb:focus-visible { outline: 3px solid var(--burg); outline-offset: 12px; }
    @keyframes breathe { 50% { transform: scale(1.03); } }

    .blob { position: absolute; border-radius: 50%; filter: blur(20px); mix-blend-mode: normal; }
    .b1 { width: 72%; height: 72%; left: -12%; top: -8%; background: #9a2b45; opacity: .9; animation: d1 9s ease-in-out infinite; }
    .b2 { width: 54%; height: 54%; right: -10%; top: 14%; background: #8c9b8d; opacity: .62; animation: d2 11s ease-in-out infinite; }
    .b3 { width: 50%; height: 50%; left: 20%; bottom: -14%; background: #eadfca; opacity: .5; animation: d3 13s ease-in-out infinite; }
    @keyframes d1 { 50% { transform: translate(35%, 30%) scale(1.15); } }
    @keyframes d2 { 50% { transform: translate(-40%, 20%) scale(.9); } }
    @keyframes d3 { 50% { transform: translate(25%, -35%) scale(1.2); } }

    .ribbons {
      position: absolute; inset: 0; border-radius: 50%; mix-blend-mode: overlay; opacity: .75; filter: blur(6px);
      background: conic-gradient(from 0deg, transparent 0 20%, rgba(255,246,228,.8) 28%, transparent 36% 62%, rgba(255,246,228,.55) 70%, transparent 78%);
      animation: spin 12s linear infinite;
    }
    .glass {
      position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 30% 22%, rgba(255,250,238,.55) 0, rgba(255,250,238,0) 38%),
                  radial-gradient(circle at 50% 120%, rgba(255,250,238,.25) 0, rgba(255,250,238,0) 50%);
      box-shadow: inset 0 0 40px rgba(255, 246, 228, .2);
    }

    /* voice waveform inside the orb */
    .wave { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: calc(var(--size) * .028); z-index: 1; }
    .wave i {
      display: block; width: calc(var(--size) * .032); height: calc(var(--size) * .5 * var(--h));
      border-radius: 99px; background: linear-gradient(#fffaf0, rgba(245, 232, 205, .65));
      box-shadow: 0 0 10px rgba(255, 244, 220, .65);
      transform-origin: center; animation: eq var(--dur, 2.2s) ease-in-out infinite; animation-delay: calc(var(--i) * -.19s);
    }
    @keyframes eq { 0%, 100% { transform: scaleY(.22); opacity: .75; } 50% { transform: scaleY(1); opacity: 1; } }

    /* speaking state (set from JS on the stage) */
    .stage.speaking .orb { animation: breathe 1.1s ease-in-out infinite; }
    .stage.speaking .wave i { --dur: .55s; }
    .stage.speaking .ribbons { animation-duration: 3s; }
    .stage.speaking .ripple { animation-duration: 2s; }
    .stage.speaking .ring { animation-duration: 9s; }

    /* ---------- call to action + trust row ---------- */
    .cta {
      display: inline-flex; align-items: center; gap: 10px; margin: 0; padding: 11px 24px; border-radius: 999px;
      background: var(--burg); color: var(--cream-hi); font-size: 15px; font-weight: 600; letter-spacing: .03em;
      box-shadow: 0 10px 24px -8px rgba(78, 21, 34, .6);
    }
    .cta::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sage-lt); box-shadow: 0 0 0 0 rgba(223, 229, 220, .7); animation: ping 1.8s infinite; }
    @keyframes ping { 70% { box-shadow: 0 0 0 9px rgba(223, 229, 220, 0); } 100% { box-shadow: 0 0 0 0 rgba(223, 229, 220, 0); } }
    .trust { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; margin: 0; padding: 0; list-style: none; }
    .trust li { font-size: 13px; color: var(--sage-dk); padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(85, 101, 90, .35); background: rgba(252, 248, 239, .7); }
    .links { position: fixed; bottom: 16px; left: 0; right: 0; font-size: 13px; }
    .links a { color: var(--sage-dk); text-decoration: none; font-weight: 600; border-bottom: 1px solid transparent; }
    .links a:hover { color: var(--burg); border-bottom-color: var(--burg); }

    @media (max-width: 480px) {
      .eyebrow { letter-spacing: .2em; font-size: 11px; }
      .eyebrow::before, .eyebrow::after { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .wave i { transform: scaleY(.6); }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Nova Mart · Customer support</div>
    <h1 class="title"><span>Voice Assistant</span><span class="emoji" aria-hidden="true">🎙️</span></h1>
    <p class="sub">Ask about your order, opening hours, returns or shipping, just by talking.</p>
  </header>

  <div class="stage" id="stage">
    <span class="ring r3"></span><span class="ring r2"></span><span class="ring r1"></span>
    <span class="ripple"></span><span class="ripple"></span><span class="ripple"></span>
    <button class="orb" id="orb" type="button" aria-label="Start the voice assistant">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
      <span class="ribbons"></span>
      <span class="wave" aria-hidden="true">
        <i style="--i:0;--h:.35"></i><i style="--i:1;--h:.5"></i><i style="--i:2;--h:.68"></i><i style="--i:3;--h:.85"></i>
        <i style="--i:4;--h:.95"></i><i style="--i:5;--h:1"></i><i style="--i:6;--h:.95"></i><i style="--i:7;--h:.85"></i>
        <i style="--i:8;--h:.68"></i><i style="--i:9;--h:.5"></i><i style="--i:10;--h:.35"></i>
      </span>
      <span class="glass"></span>
    </button>
  </div>

  <p class="cta" id="hint">Tap the orb to start</p>
  <ul class="trust" aria-label="About this service">
    <li>🤖 Automated assistant</li>
    <li>📝 Recorded as text for staff review</li>
    <li>🙋 Human handoff available</li>
  </ul>
  <div class="links"><a href="staff.html" id="staff-link">Staff dashboard</a></div>

  <script>
    // Keep ?mock=1 (or any query string) when moving between pages.
    const q = location.search;
    document.getElementById("staff-link").href = "staff.html" + q;
    const GREETING = "Hello, I'm Nova Mart's automated assistant. How can I help you today?";
    const orb = document.getElementById("orb");
    const stage = document.getElementById("stage");
    const hint = document.getElementById("hint");
    let going = false;

    function go() {
      if (going) return; going = true;
      document.body.style.transition = "opacity .35s";
      document.body.style.opacity = "0";
      setTimeout(() => (location.href = "call.html" + q), 350);
    }

    orb.addEventListener("click", () => {
      if (going) return;
      try { sessionStorage.setItem("greeted", "1"); } catch {}
      if (!("speechSynthesis" in window)) { try { sessionStorage.removeItem("greeted"); } catch {} return go(); }
      // Speak the greeting now: a tap is the user gesture browsers require for audio.
      stage.classList.add("speaking");
      hint.textContent = "Nova Mart's automated assistant is greeting you…";
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(GREETING);
      u.lang = "en-US";
      u.onend = u.onerror = go;
      speechSynthesis.speak(u);
      setTimeout(go, 9000); // safety net if speech never finishes
    });
  </script>
</body>
</html>
