<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Assistant</title>
  <style>
    :root { color-scheme: dark; --ink: #f3f6fc; --muted: #8e99b3; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      position: relative; min-height: 100vh; overflow-x: hidden;
      background: #0a0d16; color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 26px; padding: 28px 20px 56px; text-align: center;
    }

    /* ---------- background: soft aurora + fading dot grid ---------- */
    body::before {
      content: ""; position: fixed; inset: -20%; z-index: -2; pointer-events: none;
      background:
        radial-gradient(40% 35% at 25% 30%, rgba(76, 125, 255, .28), transparent 70%),
        radial-gradient(38% 34% at 78% 28%, rgba(150, 90, 255, .24), transparent 70%),
        radial-gradient(45% 40% at 55% 85%, rgba(25, 211, 197, .16), transparent 70%);
      animation: aurora 22s ease-in-out infinite alternate;
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, .13) 1px, transparent 1.2px);
      background-size: 34px 34px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 15%, transparent 70%);
              mask-image: radial-gradient(ellipse at 50% 50%, #000 15%, transparent 70%);
    }
    @keyframes aurora { to { transform: translate(4%, -3%) rotate(6deg) scale(1.08); } }

    /* ---------- heading ---------- */
    .eyebrow { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .title {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin: 0; font-weight: 600; font-size: clamp(30px, 6vw, 54px); letter-spacing: .1em; line-height: 1.1;
    }
    .grad {
      background: linear-gradient(100deg, #ffffff 10%, #bcd0ff 50%, #d9b8ff 95%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .emoji {
      width: 1.35em; height: 1.35em; display: grid; place-items: center; font-size: .8em; letter-spacing: 0;
      border-radius: 50%; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .16);
      box-shadow: 0 0 24px rgba(120, 150, 255, .35); animation: bob 3.4s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform: translateY(-5px) rotate(-6deg); } }
    .sub { margin: 12px auto 0; max-width: 44ch; color: var(--muted); font-size: 15px; }

    /* ---------- stage: orb + orbits + ripples ---------- */
    .stage {
      --size: clamp(150px, 26vmin, 230px);
      position: relative; width: calc(var(--size) * 1.95); height: calc(var(--size) * 1.95);
      display: grid; place-items: center; flex: none;
    }
    .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(150, 180, 255, .2); animation: spin 26s linear infinite; }
    .ring::after {
      content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%;
      background: #bcd0ff; box-shadow: 0 0 14px 3px rgba(130, 170, 255, .8);
    }
    .r1 { width: 68%; height: 68%; animation-duration: 18s; }
    .r2 { width: 84%; height: 84%; border-style: dashed; border-color: rgba(190, 150, 255, .22); animation-duration: 32s; animation-direction: reverse; }
    .r2::after { background: #d9b8ff; box-shadow: 0 0 14px 3px rgba(190, 140, 255, .8); top: auto; bottom: -4px; }
    .r3 { width: 100%; height: 100%; border-color: rgba(60, 220, 200, .14); animation-duration: 46s; }
    .r3::after { background: #7ff0e1; box-shadow: 0 0 14px 3px rgba(60, 220, 200, .7); width: 6px; height: 6px; margin-left: -3px; top: -3px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ripple {
      position: absolute; width: var(--size); height: var(--size); border-radius: 50%;
      border: 1.5px solid rgba(140, 175, 255, .55); opacity: 0; animation: ripple 5s ease-out infinite;
    }
    .ripple:nth-of-type(2) { animation-delay: 1.7s; }
    .ripple:nth-of-type(3) { animation-delay: 3.4s; }
    @keyframes ripple { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.85); opacity: 0; } }

    /* ---------- the orb ---------- */
    .orb {
      position: relative; width: var(--size); height: var(--size);
      border: 0; padding: 0; border-radius: 50%; cursor: pointer; background: #0e1330;
      overflow: hidden; isolation: isolate; z-index: 2;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .22) inset,
                  0 0 50px 4px rgba(80, 140, 255, .45),
                  0 0 120px 24px rgba(160, 90, 255, .25);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s;
      animation: breathe 5s ease-in-out infinite;
    }
    .orb:hover { transform: scale(1.06); box-shadow: 0 0 0 1px rgba(255,255,255,.35) inset, 0 0 70px 8px rgba(80,140,255,.6), 0 0 150px 32px rgba(160,90,255,.38); }
    .orb:active { transform: scale(.97); }
    .orb:focus-visible { outline: 3px solid #9db6ff; outline-offset: 10px; }
    @keyframes breathe { 50% { transform: scale(1.03); } }

    .blob { position: absolute; border-radius: 50%; filter: blur(22px); mix-blend-mode: screen; opacity: .9; }
    .b1 { width: 70%; height: 70%; left: -10%; top: -5%; background: #2f7bff; animation: d1 9s ease-in-out infinite; }
    .b2 { width: 65%; height: 65%; right: -12%; top: 10%; background: #a64dff; animation: d2 11s ease-in-out infinite; }
    .b3 { width: 60%; height: 60%; left: 20%; bottom: -15%; background: #19d3c5; animation: d3 13s ease-in-out infinite; }
    @keyframes d1 { 50% { transform: translate(35%, 30%) scale(1.15); } }
    @keyframes d2 { 50% { transform: translate(-40%, 20%) scale(.9); } }
    @keyframes d3 { 50% { transform: translate(25%, -35%) scale(1.2); } }

    .ribbons {
      position: absolute; inset: 0; border-radius: 50%; mix-blend-mode: overlay; opacity: .8; filter: blur(6px);
      background: conic-gradient(from 0deg, transparent 0 20%, rgba(255,255,255,.7) 28%, transparent 36% 62%, rgba(255,255,255,.5) 70%, transparent 78%);
      animation: spin 12s linear infinite;
    }
    .glass {
      position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.55) 0, rgba(255,255,255,0) 38%),
                  radial-gradient(circle at 50% 120%, rgba(255,255,255,.25) 0, rgba(255,255,255,0) 50%);
      box-shadow: inset 0 0 40px rgba(255, 255, 255, .18);
    }

    /* voice waveform inside the orb */
    .wave { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: calc(var(--size) * .028); z-index: 1; }
    .wave i {
      display: block; width: calc(var(--size) * .032); height: calc(var(--size) * .5 * var(--h));
      border-radius: 99px; background: linear-gradient(#ffffff, rgba(255, 255, 255, .55));
      box-shadow: 0 0 10px rgba(255, 255, 255, .7);
      transform-origin: center; animation: eq var(--dur, 2.2s) ease-in-out infinite; animation-delay: calc(var(--i) * -.19s);
    }
    @keyframes eq { 0%, 100% { transform: scaleY(.22); opacity: .75; } 50% { transform: scaleY(1); opacity: 1; } }

    /* speaking state (set from JS on the stage) */
    .stage.speaking .orb { animation: breathe 1.1s ease-in-out infinite; }
    .stage.speaking .wave i { --dur: .55s; }
    .stage.speaking .ribbons { animation-duration: 3s; }
    .stage.speaking .ripple { animation-duration: 2s; }
    .stage.speaking .ring { animation-duration: 9s; }

    /* ---------- call to action + trust row ---------- */
    .cta {
      display: inline-flex; align-items: center; gap: 10px; margin: 0; padding: 10px 22px; border-radius: 999px;
      background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .15); backdrop-filter: blur(8px);
      font-size: 15px; letter-spacing: .04em;
    }
    .cta::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #5fe3a1; box-shadow: 0 0 0 0 rgba(95, 227, 161, .6); animation: ping 1.8s infinite; }
    @keyframes ping { 70% { box-shadow: 0 0 0 9px rgba(95, 227, 161, 0); } 100% { box-shadow: 0 0 0 0 rgba(95, 227, 161, 0); } }
    .trust { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; margin: 0; padding: 0; list-style: none; }
    .trust li { font-size: 12.5px; color: var(--muted); padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .09); background: rgba(255, 255, 255, .03); }
    .links { position: fixed; bottom: 16px; left: 0; right: 0; font-size: 13px; }
    .links a { color: #7681a0; text-decoration: none; }
    .links a:hover { color: #cfd8ef; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .wave i { transform: scaleY(.6); }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Nova Mart · Customer support</div>
    <h1 class="title"><span class="grad">Voice Assistant</span><span class="emoji" aria-hidden="true">🎙️</span></h1>
    <p class="sub">Ask about your order, opening hours, returns or shipping, just by talking.</p>
  </header>

  <div class="stage" id="stage">
    <span class="ring r3"></span><span class="ring r2"></span><span class="ring r1"></span>
    <span class="ripple"></span><span class="ripple"></span><span class="ripple"></span>
    <button class="orb" id="orb" type="button" aria-label="Start the voice assistant">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
      <span class="ribbons"></span>
      <span class="wave" aria-hidden="true">
        <i style="--i:0;--h:.35"></i><i style="--i:1;--h:.5"></i><i style="--i:2;--h:.68"></i><i style="--i:3;--h:.85"></i>
        <i style="--i:4;--h:.95"></i><i style="--i:5;--h:1"></i><i style="--i:6;--h:.95"></i><i style="--i:7;--h:.85"></i>
        <i style="--i:8;--h:.68"></i><i style="--i:9;--h:.5"></i><i style="--i:10;--h:.35"></i>
      </span>
      <span class="glass"></span>
    </button>
  </div>

  <p class="cta" id="hint">Tap the orb to start</p>
  <ul class="trust" aria-label="About this service">
    <li>🤖 Automated assistant</li>
    <li>📝 Recorded as text for staff review</li>
    <li>🙋 Human handoff available</li>
  </ul>
  <div class="links"><a href="staff.html" id="staff-link">Staff dashboard</a></div>

  <script>
    // Keep ?mock=1 (or any query string) when moving between pages.
    const q = location.search;
    document.getElementById("staff-link").href = "staff.html" + q;
    const GREETING = "Hello, I'm Nova Mart's automated assistant. How can I help you today?";
    const orb = document.getElementById("orb");
    const stage = document.getElementById("stage");
    const hint = document.getElementById("hint");
    let going = false;

    function go() {
      if (going) return; going = true;
      document.body.style.transition = "opacity .35s";
      document.body.style.opacity = "0";
      setTimeout(() => (location.href = "call.html" + q), 350);
    }

    orb.addEventListener("click", () => {
      if (going) return;
      try { sessionStorage.setItem("greeted", "1"); } catch {}
      if (!("speechSynthesis" in window)) { try { sessionStorage.removeItem("greeted"); } catch {} return go(); }
      // Speak the greeting now: a tap is the user gesture browsers require for audio.
      stage.classList.add("speaking");
      hint.textContent = "Nova Mart's automated assistant is greeting you…";
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(GREETING);
      u.lang = "en-US";
      u.onend = u.onerror = go;
      speechSynthesis.speak(u);
      setTimeout(go, 9000); // safety net if speech never finishes
    });
  </script>
</body>
</html>
